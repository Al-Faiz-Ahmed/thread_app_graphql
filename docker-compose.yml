services:
  threads_db:
    image: postgres:16
    container_name: threads_db
    ports: 
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_DB=threads_db
      - POSTGRES_PASSWORD=random
volumes:
  postgres_data:


